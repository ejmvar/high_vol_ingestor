services:
  ingestor:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.ingestor
    environment:
      INGESTOR_HOST: 0.0.0.0
      INGESTOR_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-nvt.telemetry.raw.v1}
    ports:
      - "8080:8080"
    networks:
      - nvt-local
    depends_on:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 12

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:${REDPANDA_EXTERNAL_PORT:-19092}
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${REDPANDA_EXTERNAL_PORT:-19092}
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "${REDPANDA_EXTERNAL_PORT:-19092}:19092"
      - "19644:9644"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - nvt_redpanda_data:/var/lib/redpanda/data
    networks:
      - nvt-local
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--api-urls", "redpanda:9644"]
      interval: 10s
      timeout: 5s
      retries: 12

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-local-rustfs-access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-local-rustfs-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nvt_rustfs_data:/data
      - nvt_rustfs_logs:/logs
    networks:
      - nvt-local

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-telemetry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-local_telemetry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9009"
    volumes:
      - nvt_clickhouse_data:/var/lib/clickhouse
      - nvt_clickhouse_logs:/var/log/clickhouse-server
    networks:
      - nvt-local
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-local_catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    ports:
      - "5432:5432"
    volumes:
      - nvt_postgres_data:/var/lib/postgresql/data
    networks:
      - nvt-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nvt_redpanda_data:
    name: nvt_redpanda_data
  nvt_rustfs_data:
    name: nvt_rustfs_data
  nvt_rustfs_logs:
    name: nvt_rustfs_logs
  nvt_clickhouse_data:
    name: nvt_clickhouse_data
  nvt_clickhouse_logs:
    name: nvt_clickhouse_logs
  nvt_postgres_data:
    name: nvt_postgres_data

networks:
  nvt-local:
    name: nvt-local
